links:
- ref: egp-1044
  id: 1044
  guideword: 'FORM: VERB + PARTICLE + PREPOSITION + OBJECT'
  can_do: Can use a limited range of verbs + particle + preposition + noun or pronoun.
  detectability: form
- ref: egp-1049
  id: 1049
  guideword: 'FORM: VERB + PREPOSITION + OBJECT'
  can_do: Can use an increasing range of prepositional verbs followed by noun or pronoun objects.
  detectability: form
- ref: egp-1055
  id: 1055
  guideword: 'FORM: REPORTING VERBS + DIRECT OBJECT ''THAT''-CLAUSE'
  can_do: Can use an increasing range of verbs, typically reporting or mental process verbs, with a 'that'-clause
    as the direct object.
  detectability: form
- ref: egp-1056
  id: 1056
  guideword: 'FORM: VERBS + PREPOSITIONAL PHRASE + ''THAT''-CLAUSE'
  can_do: Can use some reporting verbs with a prepositional phrase followed by a 'that'-clause as the
    direct object.
  detectability: form
- ref: egp-1074
  id: 1074
  guideword: 'FORM: SEMI-MODAL AUXILIARY VERBS, ''USED TO'', ''OUGHT TO'''
  can_do: Can use semi-modal auxiliary verbs, 'used to' and 'ought to'.
  detectability: form
- ref: egp-1099
  id: 1099
  guideword: 'FORM: NEGATIVE'
  can_do: Can use 'There' + 'be' + 'n?t' with countable and uncountable nouns.
  detectability: form
- ref: egp-1100
  id: 1100
  guideword: 'FORM: ''THERE'' + MODAL VERBS'
  can_do: Can use 'there' with a range of modal verbs + 'be' + complement.
  detectability: form
