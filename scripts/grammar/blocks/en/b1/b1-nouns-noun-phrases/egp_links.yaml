note: External EGP references only — not stored in application DB
links:
- ref: egp-657
  id: 657
  guideword: 'FORM: COMPLEX NOUN PHRASES WITH ADJECTIVES'
  can_do: Can form an increasing range of complex noun phrases with more than one adjective.
  detectability: form
- ref: egp-658
  id: 658
  guideword: 'FORM: COMPLEX NOUN PHRASES WITH ADVERBS + ADJECTIVES'
  can_do: Can form complex noun phrases with adverb + adjective + noun.
  detectability: form
- ref: egp-659
  id: 659
  guideword: 'FORM/USE: ''SUCH (A)'' + ADJECTIVE + NOUN'
  can_do: Can form noun phrases with 'such a' + adjective + singular noun and 'such' + adjective + plural
    noun, to give emphasis.
  detectability: form
- ref: egp-660
  id: 660
  guideword: 'FORM: NOUN + PREPOSITIONAL PHRASES'
  can_do: Can form complex noun phrases by using a prepositional phrase after the main noun in a noun
    phrase.
  detectability: form
- ref: egp-661
  id: 661
  guideword: 'FORM/USE: NOUN PHRASES WITH SUPERLATIVES'
  can_do: Can use a clause with a present perfect or past perfect as a superlative noun phrase complement,
    to talk about uniqueness.
  detectability: form
- ref: egp-662
  id: 662
  guideword: 'FORM/USE: POSSESSIVE ''‘S'' WITHOUT NOUN'
  can_do: Can omit the noun after possessive '’s' to talk about a place which is familiar to the speaker
    and listener.
  detectability: form
- ref: egp-663
  id: 663
  guideword: 'FORM: NOUN + ''OF'' + POSSESSIVE PRONOUN'
  can_do: Can form noun phrases with noun + 'of' + possessive pronouns.
  detectability: form
- ref: egp-664
  id: 664
  guideword: 'FORM: FRIEND + ''OF'' + POSSESSIVE DETERMINER + NOUN'
  can_do: Can form noun phrases with 'a friend of' or 'friends of' + possessive determiner + noun.
  detectability: form
- ref: egp-665
  id: 665
  guideword: 'FORM: COMPLEX NOUN PHRASE WITH POSSESSIVE ''‘S'' + NOUN'
  can_do: Can form complex noun phrases with noun phrase + 'of' + noun phrase + possessive determiner
    ''s' + noun phrase.
  detectability: form
- ref: egp-666
  id: 666
  guideword: 'FORM: NOUN PHRASE, NOUN PHRASE'
  can_do: Can put two noun phrases together (in apposition) to refer to the same person or thing, usually
    separated by commas.
  detectability: form
- ref: egp-667
  id: 667
  guideword: 'FORM: INDEFINITE PRONOUNS'
  can_do: Can form noun phrases with an indefinite pronoun + adjective or clause.
  detectability: form
- ref: egp-668
  id: 668
  guideword: 'FORM/USE: ''THE THING …'''
  can_do: Can use the noun phrase 'The thing' in front position, with a clause complement, to give focus
    to something.
  detectability: form
