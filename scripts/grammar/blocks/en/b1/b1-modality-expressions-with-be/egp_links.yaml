links:
- ref: egp-465
  id: 465
  guideword: 'FORM: MODAL WITH ''BE ABLE TO'''
  can_do: Can use a range of modal verbs + 'be able to' + infinitive.
  detectability: form
- ref: egp-466
  id: 466
  guideword: 'FORM: ''BE'' EXPRESSIONS'
  can_do: Can use a limited range of expressions with 'be' + infinitive ('be allowed to', 'be supposed
    to', 'be able to') with present and past forms of 'be' and with modal 'will'.
  detectability: form
- ref: egp-467
  id: 467
  guideword: 'USE: ''BE ALLOWED TO'', PERMISSION'
  can_do: Can use 'be allowed to' to talk about permission.
  detectability: use
- ref: egp-468
  id: 468
  guideword: 'USE: ''BE SUPPOSED TO'', PAST EXPECTATION'
  can_do: Can use 'was supposed to', 'were supposed to' to refer to past or future arrangements which
    may not have happened or may change.
  detectability: use
- ref: egp-469
  id: 469
  guideword: 'USE: ''BE ABLE TO'', PAST'
  can_do: Can use 'was able to', 'were able to' to talk about facts in the past.
  detectability: use
