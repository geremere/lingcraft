  id: 625
  guideword: 'FORM/USE: AFTER ''IF'' CLAUSES'
  can_do: Can use 'would' in the main clause of a conditional sentence to talk about an imagined situation,
    often in the context of advice or opinion-giving.
  detectability: form
- ref: egp-626
  id: 626
  guideword: 'FORM: PAST AFFIRMATIVE'
  can_do: Can use 'would have' + '-ed'.
  detectability: form
- ref: egp-627
  id: 627
  guideword: 'FORM: PAST NEGATIVE'
  can_do: Can use 'would not have' + '-ed' or 'wouldn’t have' + '-ed'
  detectability: form
- ref: egp-628
  id: 628
  guideword: 'FORM: QUESTIONS'
  can_do: Can use question forms.
  detectability: form
- ref: egp-629
  id: 629
  guideword: 'FORM: WITH ADVERBS'
  can_do: Can use an limited range of adverbs with 'would', including 'really', 'probably', 'certainly',
    'definitely'.► adverbs
  detectability: form
- ref: egp-630
  id: 630
  guideword: 'USE: FUTURE IN THE PAST'
  can_do: Can use 'would' to talk about the future in the past.
