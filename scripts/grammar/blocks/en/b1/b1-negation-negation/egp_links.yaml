links:
- ref: egp-1185
  id: 1185
  guideword: 'FORM: AUXILIARY VERBS ''BE'', ''HAVE'', PAST'
  can_do: Can form negative statements of main verbs in the past continuous and past perfect with auxiliary
    verbs 'be' and 'have' + 'not/n't'. ► past continuous ► past perfect
  detectability: form
- ref: egp-1186
  id: 1186
  guideword: 'FORM: MENTAL PROCESS VERBS + CLAUSE'
  can_do: Can use the negative forms of mental process verbs ('I don?t think', 'I don?t believe') followed
    by a complement clause, where the negative form is in the mental process verb rather than the complement
    clause.
  detectability: form
- ref: egp-1187
  id: 1187
  guideword: 'FORM: QUESTIONS'
  can_do: Can use negative question forms in main clauses and question tags. ► questions
  detectability: form
- ref: egp-1188
  id: 1188
  guideword: 'USE: SEEKING AGREEMENT'
  can_do: Can use negative questions and question tags to involve the listener/reader by seeking agreement
    or checking something.
  detectability: use
- ref: egp-1189
  id: 1189
  guideword: 'FORM: PRONOUNS'
  can_do: Can use an increasing range of indefinite pronouns in negative contexts.
  detectability: form
- ref: egp-1190
  id: 1190
  guideword: 'FORM: ADVERBS'
  can_do: Can use adverbs 'ever', 'never', 'yet', 'still' in negative contexts.
  detectability: form
- ref: egp-1191
  id: 1191
  guideword: 'FORM: ''NOT'', NON FINITE AND ELLIPTED CLAUSES'
  can_do: Can use 'not' before a non-finite or ellipted clause.
  detectability: form
