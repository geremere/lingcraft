links:
- ref: egp-1109
  id: 1109
  guideword: 'FORM/USE: PRESENT SIMPLE ''IF'' CLAUSE + ''WILL'', FUTURE, LIKELY OUTCOME (FIRST CONDITIONAL)'
  can_do: Can use 'if' + present simple to introduce a possible future condition, with 'will' in the main
    clause to talk about a likely result.
  detectability: form
- ref: egp-1110
  id: 1110
  guideword: 'FORM/USE: PRESENT SIMPLE ''IF'' CLAUSE + MODAL, FUTURE, POSSIBLE OUTCOME'
  can_do: Can use 'if' + present simple to introduce a possible future condition, with modal verbs in
    the main clause, to talk about a possible result. ► modality
  detectability: form
- ref: egp-1111
  id: 1111
  guideword: 'FORM/USE: PRESENT CONTINUOUS ''IF'' CLAUSE , PLANS &amp; ADVICE'
  can_do: Can use 'if' + present continuous or 'going to' to introduce a possible plan, with modal verbs
    or imperatives in the main clause to give advice.
  detectability: form
- ref: egp-1112
  id: 1112
  guideword: 'FORM/USE: ''IF'' + PAST SIMPLE + ''WOULD'', FUTURE, IMAGINED SITUATION|(SECOND CONDITIONAL)'
  can_do: Can form conditional subordinate clauses with 'if' + past simple, and would in the main clause,
    to talk about an imagined situation, often in the context of advice or opinion-giving.
  detectability: form
- ref: egp-1113
  id: 1113
  guideword: 'FORM/USE: ''IF I WERE YOU'' + ''WOULD'', FUTURE, IMAGINED SITUATION'
  can_do: Can use 'if I were you' and 'would' in the main clause often in the context of advice or opinion-giving.
  detectability: form
- ref: egp-1114
  id: 1114
  guideword: 'FORM/USE: ''UNLESS'', EXCEPTIONS'
  can_do: Can use 'unless' + present simple to talk about an exception, with present and future reference.
  detectability: form
- ref: egp-1115
  id: 1115
  guideword: 'FORM/USE: ''IF'' + PAST SIMPLE + ''COULD'', FUTURE, IMAGINED SITUATION'
  can_do: Can form conditional subordinate clauses with 'if' + past simple, and 'could' in the main clause
    to talk about an imagined situation, often in the context of suggesting.
  detectability: form
- ref: egp-1116
  id: 1116
  guideword: 'FORM/USE: ''IF'' + PAST PERFECT + ''WOULD HAVE'' + ''-ED'', IMAGINED SITUATION, REGRET|(THIRD
    CONDITIONAL)'
  can_do: Can form conditional subordinate clauses with 'if' + past perfect simple and 'would have' +
    '-ed' in the main clause, to talk about imagined situations in the past, often with regret.
  detectability: form
- ref: egp-1117
  id: 1117
  guideword: 'FORM/USE: ELLIPTED ''IF NOT'', ALTERNATIVE'
  can_do: Can use 'If not' as a conditional clause to offer an alternative to refer to a previous direct
    or indirect 'yes-no' question where the answer might be ?no?.
  detectability: form
- ref: egp-1118
  id: 1118
  guideword: 'FORM/USE: ELLIPTED ''IF SO'', CONFIRMING'
  can_do: Can use 'If so' as a conditional clause to refer a previous direct or indirect 'yes-no' question
    where the answer might be ?yes?. ► Clauses coordinated
  detectability: form
