links:
- ref: egp-1124
  id: 1124
  guideword: 'USE: INVERTED ''SHOULD'', FUTURE, POSSIBLE OUTCOME, FORMAL, POLITE'
  can_do: Can use inverted 'should', + 'would' in the main clause to talk about possible future outcomes,
    in polite or formal contexts.
  detectability: use
- ref: egp-1125
  id: 1125
  guideword: 'FORM/USE: INVERTED PAST PERFECT, IMAGINED PAST'
  can_do: Can use past perfect +  inverted subject, and a modal verb + 'have' + '-ed' in the main clause  to
    talk about imagined situations in the past.
  detectability: form
- ref: egp-1126
  id: 1126
  guideword: 'FORM/USE: INVERTED ''WERE'' + ''TO'' INFINITIVE, FORMAL'
  can_do: Can use 'were' with an inverted subject + 'to' infinitive, to introduce conditions in formal
    contexts. ► past simple
  detectability: form
- ref: egp-1127
  id: 1127
  guideword: 'FORM/USE: SUBORDINATING CONJUNCTIONS, CONDITIONS'
  can_do: Can use conditional subordinate clauses with a range of conjunctions ('so long as', 'on condition
    that', 'in the event that') with past, present or future reference.|
  detectability: form
- ref: egp-1128
  id: 1128
  guideword: 'FORM/USE: ''WERE IT NOT FOR'', FORMAL'
  can_do: Can use 'Were it not for' + noun phrase to introduce conditions in formal contexts. ► past simple
  detectability: form
- ref: egp-1129
  id: 1129
  guideword: 'FORM/USE: ''IF IT WERE NOT FOR'', FORMAL'
  can_do: Can use 'If it weren?t / were not for' + noun phrase to introduce conditions in formal contexts.
    ► past simple
  detectability: form
- ref: egp-1130
  id: 1130
  guideword: 'FORM/USE: ''IF IT WERE'' + ''TO''-INFINITIVE FORM, FORMAL'
  can_do: Can use 'If it were' + 'to-' infinitive to introduce conditions in formal contexts.
  detectability: form
- ref: egp-1131
  id: 1131
  guideword: 'FORM/USE: ''WHETHER OR NOT'', FORMAL'
  can_do: Can use 'whether or not' to introduce conditions in formal contexts.
  detectability: form
