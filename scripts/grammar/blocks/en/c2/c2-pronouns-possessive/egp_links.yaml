links:
- ref: egp-903
  id: 903
  guideword: 'FORM/USE: WITH ''THAT ? OF'''
  can_do: Can use 'that ? of' + possessive pronouns to express an attitude about someone or something,
    often in humorous or sarcastic contexts.
  detectability: form
- ref: egp-904
  id: 904
  guideword: 'FORM: ''HERS'' AS SUBJECT'
  can_do: Can use the possessive pronoun 'hers' with singular reference, in subject position.
  detectability: form
- ref: egp-905
  id: 905
  guideword: 'FORM: ''HIS'''
  can_do: Can use the possessive pronoun 'his', with singular and plural reference, in subject and object
    position, and complement positions after 'be' and after prepositions.
  detectability: form
- ref: egp-906
  id: 906
  guideword: 'FORM: OF ''THEIRS'', ''HERS'', ''HIS'''
  can_do: Can use the possessive pronouns 'hers', 'theirs' and 'his' after noun + 'of'.
  detectability: form
- ref: egp-907
  id: 907
  guideword: 'FORM: ''THEIRS'' AS SUBJECT'
  can_do: Can use the possessive pronoun 'theirs', with singular and plural reference, in subject position.
  detectability: form
