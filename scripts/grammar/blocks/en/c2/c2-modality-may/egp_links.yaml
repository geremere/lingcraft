links:
- ref: egp-511
  id: 511
  guideword: 'FORM/USE: ''MAY AS WELL'''
  can_do: Can use 'may as well' to talk about what we think is the easiest or most logical course of action,
    often when we cannot see a better alternative or when it will not spoil the situation if you do that
    thing. ► might
  detectability: form
- ref: egp-512
  id: 512
  guideword: 'USE: CONCESSION'
  can_do: Can use 'may' in a subordinate clause expressing concession with 'however', 'whatever', 'whoever'
    … + 'it or this may be or seem'.
  detectability: use
- ref: egp-513
  id: 513
  guideword: 'USE: HEDGING'
  can_do: Can use 'it may be' + '-ed' that as a hedging device when drawing conclusions and summarising,
    particularly in academic contexts.
  detectability: use
