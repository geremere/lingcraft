links:
- ref: egp-328
  id: 328
  guideword: 'FORM: SINGULAR NOUN ENDING IN ''S'' + APOSTROPHE'
  can_do: Can use an apostrophe after singular nouns ending in 's', to indicate possession.
  detectability: form
- ref: egp-329
  id: 329
  guideword: 'FORM: ''''S'' WITH ELLIPTED NOUN'
  can_do: Can use ''s' without a following noun when the noun has already been mentioned or is obvious
    in the context.
  detectability: form
- ref: egp-330
  id: 330
  guideword: 'FORM: ''''S + ''S'''
  can_do: Can use two possessive ''s' constructions in the same noun phrase.
  detectability: form
