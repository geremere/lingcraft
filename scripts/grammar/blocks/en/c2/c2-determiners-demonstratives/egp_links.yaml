  guideword: 'USE: ''THIS'', IN NARRATIVES'
  can_do: Can use 'this' with nouns and noun phrases in a narrative to create a sense of immediacy.
  detectability: use
- ref: egp-316
  id: 316
  guideword: 'FORM/USE: ''THIS'' WITH NOUN AND POSSESSIVE'
  can_do: Can use 'this' + noun + 'of' + possessive pronoun to highlight something, often in a positive
    way.
  detectability: form
- ref: egp-317
  id: 317
  guideword: 'USE: EMOTIONAL DISTANCE'
  can_do: Can use 'that' and 'those' to convey emotional distance, often to express disapproval.
  detectability: use
