- ref: egp-463
  id: 463
  guideword: 'FORM/USE: NEGATIVE WITH ''DIDN''T'''
  can_do: Can use the negative form 'didn't dare' + infinitive without 'to' to talk about not being brave
    enough to do something.
  detectability: form
- ref: egp-485
  id: 485
  guideword: 'FORM: NEGATIVE'
  can_do: Can use 'be' + 'not' + adjective + 'to' + infinitive.
  detectability: form
- ref: egp-486
  id: 486
  guideword: 'FORM/USE: ''BE'' + ADJECTIVE + ''NOT'' + ''TO'''
  can_do: Can use 'be' + adjective + 'not' + 'to' + infinitive for emphasis.
  detectability: form
- ref: egp-528
  id: 528
  guideword: 'FORM: ''MIGHT AS WELL'''
  can_do: Can use 'might as well', mostly to talk about or suggest what we think is the easiest or most
    logical course of action, often when we cannot see a better alternative. ► 'may'
  detectability: form
- ref: egp-554
  id: 554
  guideword: 'FORM: QUESTIONS'
  can_do: Can use the question form.
  detectability: form
- ref: egp-601
  id: 601
  guideword: 'FORM/USE: WITH ''AS'' + PRONOUN, NARRATIVE'
  can_do: Can use 'as' + pronoun + 'used to' … to add background to a narrative, often to highlight something
    unusual.
  detectability: form
- ref: egp-602
  id: 602
  guideword: 'FORM: ''USED NOT TO'''
  can_do: Can use negative form 'used not to'
  detectability: form
- ref: egp-638
  id: 638
  guideword: 'FORM: WITH ADVERBS'
  can_do: Can use a wide range of adverbs with 'would', including 'undoubtedly', 'possibly', 'normally',
    'personally', 'eventually', 'obviously', 'significantly', 'inevitably'. ► adverbs
  detectability: form
- ref: egp-646
  id: 646
  guideword: FORM/USE, RESPONSE TOKENS
  can_do: Can use adverbs expressing certainty as short responses.
  detectability: form
