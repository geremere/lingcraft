note: External EGP references only — not stored in application DB
links:
- ref: egp-11
  id: 11
  guideword: 'FORM: COMBINING MULTIPLE ADJECTIVES'
  can_do: Can combine more complex, lengthy strings of adjectives, joining the last two adjectives with
    'and'.
  detectability: form
- ref: egp-12
  id: 12
  guideword: 'USE: FOCUS'
  can_do: Can use a list of adjectives in ellipted clauses before and after a noun, to give focus. ► focus
  detectability: use
- ref: egp-29
  id: 29
  guideword: 'FORM/USE: WITH ''NO'' OR ''NOT ANY'''
  can_do: Can use 'no' / 'not any' with comparative adjectives to limit the scale of comparison. ► comparative
    clauses
  detectability: form
- ref: egp-30
  id: 30
  guideword: 'FORM/USE: WITH ''NOT THAT MUCH'''
  can_do: Can use 'not that much' to modify comparative adjectives to a small degree. ► comparative clauses
  detectability: form
- ref: egp-43
  id: 43
  guideword: 'FORM: COMPARISON'
  can_do: Can use adjectives in 'as … as' and 'so … that' in comparative structures. ► comparative clauses
  detectability: form
- ref: egp-56
  id: 56
  guideword: 'FORM/USE: DEGREE ADJECTIVES BEFORE NOUNS'
  can_do: Can use an increasing range of adjectives before a noun to express intensity.
  detectability: form
- ref: egp-79
  id: 79
  guideword: 'FORM/USE: ''SLIGHTEST'', ''FAINTEST'''
  can_do: Can use 'the slightest', 'the faintest' with a specific range of nouns to express the least
    amount possible, most frequently following a negative verb form.
  detectability: form
