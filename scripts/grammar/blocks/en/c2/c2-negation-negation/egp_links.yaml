- ref: egp-1202
  id: 1202
  guideword: 'FORM/USE: ''NOT A'' + NOUN, EMPHASIS'
  can_do: Can use 'not a' + noun, often with a following  passive structure, for emphasis.
  detectability: form
- ref: egp-1203
  id: 1203
  guideword: 'FORM/USE: ''DON''T YOU ?'', WARNING'
  can_do: Can use a negative imperative form with 'you' to give a warning or reprimand.
  detectability: form
- ref: egp-1204
  id: 1204
  guideword: 'FORM/USE: ''NEITHER'''
  can_do: Can use 'Neither' or 'Nor' + with 'do' or 'be' + inverted subject to add to a previous related
    negative clause, to focus on an additional negative factor.
  detectability: form
- ref: egp-1205
  id: 1205
  guideword: 'FORM/USE: ''IN THE LEAST'', EMPHASIS'
  can_do: Can use 'in the least' after a negative form for emphasis.
  detectability: form
