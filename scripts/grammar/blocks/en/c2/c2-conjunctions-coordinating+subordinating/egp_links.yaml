links:
- ref: egp-274
  id: 274
  guideword: 'FORM/USE: ''NEITHER'''
  can_do: Can use 'Neither' or 'Nor' + inverted auxiliary or 'be' + subject to add to a previous related
    negative clause, to focus on an additional negative factor.
  detectability: form
- ref: egp-275
  id: 275
  guideword: 'FORM/USE: ''AND YET'', CONCESSIVE'
  can_do: Can use 'And yet' to combine sentences to introduce a contrast, often unexpected, sometimes
    in a formal context.
  detectability: form
- ref: egp-282
  id: 282
  guideword: 'FORM/USE: ''IN THAT'''
  can_do: Can use 'in that' as a subordinating conjunction, to give greater in-depth explanation, often
    in formal contexts.
  detectability: form
