- ref: egp-1171
  id: 1171
  guideword: 'FORM/USE: ''WH-''CLEFT  CLAUSE'
  can_do: Can use 'How', 'Why', or 'Where' cleft clauses as subject, for focus
  detectability: form
- ref: egp-1172
  id: 1172
  guideword: 'FORM/USE: ''THE'' + PREMODIFIER + ''THING, FACT etc.'' + ''IS (THAT)'''
  can_do: Can use 'The' + premodifier + 'thing, fact, point, problem or reason' + 'is (that)' for focus.
  detectability: form
- ref: egp-1173
  id: 1173
  guideword: 'FORM/USE: ''IT'' CLEFT'
  can_do: Can use 'It' + 'be' + noun + 'that' clause for focus.
