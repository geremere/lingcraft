- ref: egp-922
  id: 922
  guideword: 'FORM: (OBJECT) ''IT'''
  can_do: Can use the pronoun 'it' as a direct object to refer to an object or situation already referred
    to.
  detectability: form
- ref: egp-923
  id: 923
  guideword: 'FORM: (OBJECT) ''ME'', ''YOU'', ''HER'', ''HIM'', ''US'', ''THEM'''
  can_do: Can use the pronouns 'me', 'you', 'him', 'her', 'us' and 'them' in the direct object position
    after a transitive verb.
  detectability: form
- ref: egp-924
  id: 924
  guideword: 'FORM: (OBJECT) WITH PREPOSITION'
  can_do: Can use the object pronouns 'me', 'you', 'him', 'her', 'it', 'us' and 'them' in the object position
    after prepositions.
  detectability: form
- ref: egp-925
  id: 925
  guideword: 'FORM: (SUBJECT) ''IT'' FOR FIRST PERSON'
  can_do: Can use the pronoun 'it' before 'be' to refer to a first person speaker or writer.
  detectability: form
- ref: egp-926
  id: 926
  guideword: 'FORM: (SUBJECT) QUESTIONS'
  can_do: Can use the pronouns 'I', 'you', 'we' and 'they' after an auxiliary or modal verb in question
    forms.
  detectability: form
- ref: egp-927
  id: 927
  guideword: 'FORM: (SUBJECT) QUESTIONS WITH ''BE'''
  can_do: Can use the pronouns 'you' and 'it' after 'be' in question forms.
  detectability: form
- ref: egp-928
  id: 928
  guideword: 'FORM: (SUBJECT) STATEMENTS'
  can_do: Can use the pronouns 'I', 'you', 'he', 'she', 'it', 'we' and 'they' in the subject position
