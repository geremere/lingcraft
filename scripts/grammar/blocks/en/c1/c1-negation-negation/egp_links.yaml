  guideword: 'FORM: ''NONE'', SUBSTITUTION'
  can_do: 'Can use negative pronoun ''none'' to substitute for subject and object pronouns or noun phrases.
    ► pronouns: substitution'
  detectability: form
- ref: egp-1197
  id: 1197
  guideword: 'FORM: ''NOT ALL'', ''NOT EVERY'''
  can_do: Can use 'not with indefinite pronouns 'everyone' and 'everything' and determiners 'every', 'all'.
  detectability: form
- ref: egp-1198
  id: 1198
  guideword: 'FORM/USE: ''NOT ONLY ? (BUT) ALSO'' WITH INVERSION'
  can_do: Can use auxiliary 'do' + inverted subject after 'not only', to give focus.
  detectability: form
- ref: egp-1199
  id: 1199
  guideword: 'FORM/USE: ''NOT'' + STANCE ADVERB, HEDGING'
  can_do: Can use 'not' + stance adverb, often  in a mid position, to soften the directness of a statement.
  detectability: form
- ref: egp-1200
  id: 1200
  guideword: 'USE: FORMAL'
  can_do: Can use '(very) few' meaning 'not many' to refer to people in formal written contexts, often
    reports or surveys.
  detectability: use
- ref: egp-1201
  id: 1201
  guideword: 'FORM/USE: ''WHATSOEVER'', EMPHASIS'
  can_do: Can use 'whatsoever' after a negative form for emphasis.
  detectability: form
