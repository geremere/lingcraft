note: External EGP references only — not stored in application DB
links:
- ref: egp-10
  id: 10
  guideword: 'FORM: COMPOUND ADJECTIVES'
  can_do: Can use a wide range of compound adjectives ('open-minded', 'above-mentioned', 'well-to-do',
    'jaw-dropping')
  detectability: form
- ref: egp-42
  id: 42
  guideword: 'FORM: WITH EXTREME ADVERBS'
  can_do: Can modify gradable adjectives with extreme adverbs of degree ('absolutely', 'extremely', 'incredibly',
    'totally') to intensify their meaning.
  detectability: form
- ref: egp-55
  id: 55
  guideword: 'FORM: PAST PARTICPLE AS ADJECTIVE'
  can_do: Can use the '–ed' form of a verb as an adjective, after a noun.
  detectability: form
- ref: egp-77
  id: 77
  guideword: 'FORM/USE: WITH NOUN AND POSTMODFIER'
  can_do: Can use a postmodifier to make the superlative stronger in the structure superlative + postmodifier
    + noun.
  detectability: form
- ref: egp-78
  id: 78
  guideword: 'FORM/USE: WITH POSTMODFIER AND NOUN'
  can_do: Can use a postmodifier to make the superlative stronger, in the structure superlative + noun
    + postmodifier ('possible', 'ever', 'by far').
  detectability: form
