links:
- ref: egp-359
  id: 359
  guideword: 'USE: EXPECTATIONS WITH ''MIGHT'' OR ''MAY'''
  can_do: Can use the future continuous with 'might' or 'may' to talk about an event or activity potentially
    in progress at a specified or understood time in the future.
  detectability: use
- ref: egp-395
  id: 395
  guideword: 'FORM: NEGATIVE ''SHALL'''
  can_do: Can use the negative form 'shall not'.
  detectability: form
- ref: egp-410
  id: 410
  guideword: 'FORM: WITH ADVERBS'
  can_do: Can use 'be' + 'going to' with an increasing range of adverbs (particularly adverbs of certainty)
    in the normal mid position.
  detectability: form
- ref: egp-422
  id: 422
  guideword: 'FORM: WITH ''BY THE TIME'''
  can_do: Can use the present simple with 'by the time' to refer to the future.
  detectability: form
- ref: egp-423
  id: 423
  guideword: 'USE: SUGGESTIONS, OBLIGATION'
  can_do: Can use the present simple after speech act verbs expressing suggestions and obligation.
  detectability: use
