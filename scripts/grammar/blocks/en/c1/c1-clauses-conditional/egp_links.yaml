links:
- ref: egp-1120
  id: 1120
  guideword: 'FORM/USE: ''IF'' + PAST PERFECT + MODAL VERBS IMAGINED SITUATION, REGRET'
  can_do: Can form conditional subordinate clauses with if + the past perfect simple and modal verb +
    'have' + '-ed' in the main clause, to talk about imagined situations in the past, often with regret.
  detectability: form
- ref: egp-1121
  id: 1121
  guideword: 'FORM: ELLIPTED ''IF'' CLAUSE'
  can_do: Can form ellipted 'if' clauses with 'if' + '-ed' form.
  detectability: form
- ref: egp-1122
  id: 1122
  guideword: 'FORM/USE: ''IF'' + ''SHOULD'', FORMAL, POLITE'
  can_do: Can form subordinate conditional clauses with 'if you should', in polite, formal contexts.
  detectability: form
- ref: egp-1123
  id: 1123
  guideword: 'FORM: INVERTED CONDITIONAL CLAUSE, ''SHOULD'''
  can_do: Can introduce a conditional subordinate clause with 'should' + inverted subject.
  detectability: form
