links:
- ref: egp-197
  id: 197
  guideword: 'FORM/USE: ''LET'' + THIRD PERSON PRONOUN, PERMISSION, ORDER'
  can_do: Can use an imperative clause with  'let' + 'him/her/them' + base form of a main verb, to  give
    permission or allow something or instruct someone to allow something.
  detectability: form
- ref: egp-198
  id: 198
  guideword: 'FORM/USE: DON''T ''LET'' + PRONOUN, PERMISSION, ORDER'
  can_do: Can use an imperative clause with  'let' + 'him/her/them' + base form of a main verb, to disallow
    something or instruct someone to disallow something.
  detectability: form
- ref: egp-199
  id: 199
  guideword: 'USE: POINTING, IN FORMAL CONTEXTS'
  can_do: Can use imperatives to point within or to a document within formal contexts, often academic.
  detectability: use
- ref: egp-200
  id: 200
  guideword: 'FORM/USE: IMPERATIVE + ''AND'' CONDITIONAL'
  can_do: Can use imperatives to introduce a condition followed by 'and' to introduce a consequence of
    the condition.
  detectability: form
