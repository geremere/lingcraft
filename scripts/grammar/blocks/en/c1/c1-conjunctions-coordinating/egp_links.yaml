  id: 270
  guideword: 'FORM/USE: ''YET'', CONCESSIVE'
  can_do: Can use '(and) yet' to combine phrases and clauses to introduce a contrast, often unexpected.
  detectability: form
- ref: egp-271
  id: 271
  guideword: 'FORM: ''EITHER … OR'''
  can_do: Can use 'either … or' to combine more complex strings of clauses and sentences.
  detectability: form
- ref: egp-272
  id: 272
  guideword: 'FORM/USE: ''NOT ONLY … BUT ALSO'''
  can_do: Can use 'not only … but also' to combine phrases and clauses, often for focus or emphasis.
  detectability: form
- ref: egp-273
  id: 273
  guideword: 'FORM/USE: ''NOT ONLY … BUT ALSO'' WITH INVERSION'
  can_do: Can use inverted auxiliary 'do' + the subject after 'not only', to give focus.
  detectability: form
