  id: 357
  guideword: 'FORM: QUESTIONS'
  can_do: Can use 'yes/no' and 'wh-' question forms with 'will'.
  detectability: form
- ref: egp-358
  id: 358
  guideword: 'USE: POLITENESS'
  can_do: Can use the future continuous with 'will' as a polite question form, in place of the present
    simple or future simple.
  detectability: use
- ref: egp-368
  id: 368
  guideword: 'USE: ''BE ABOUT TO'''
  can_do: Can use the simple past form of 'be' + 'about to' (often with 'just') to talk about the immediate
    future from a point in the past.
  detectability: use
- ref: egp-369
  id: 369
  guideword: 'USE: ''BE ON THE POINT OF'''
  can_do: Can use the simple past form of 'be' + 'on the point of' + '-ing' to talk about things that
    were expected to happen soon after a point in the past.
  detectability: use
- ref: egp-416
  id: 416
  guideword: 'USE: FUTURE ARRANGEMENTS'
  can_do: Can use the present continuous with a wide range of verbs to talk about future arrangements.
  detectability: use
- ref: egp-417
  id: 417
  guideword: 'USE: QUESTIONS ABOUT THE FUTURE'
  can_do: Can use the present continuous with a wide range of common verbs to ask about future plans.
  detectability: use
