links:
- ref: egp-26
  id: 26
  guideword: 'FORM/USE: WITH ''A LOT'''
  can_do: Can use 'a lot' to modify and intensify comparative adjectives used predicatively after a verb,
    usually 'be'.
  detectability: form
- ref: egp-27
  id: 27
  guideword: 'FORM/USE: WITH ''MUCH'' + NOUN'
  can_do: Can use 'much' to modify and intensify comparative adjectives used attributively before countable
    and uncountable nouns.
  detectability: form
- ref: egp-28
  id: 28
  guideword: 'FORM/USE: WITH ''SLIGHTLY'''
  can_do: Can use 'slightly' to modify comparative adjectives to a small degree.
  detectability: form
