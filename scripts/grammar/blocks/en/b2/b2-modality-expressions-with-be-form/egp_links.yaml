note: External EGP references only — not stored in application DB
links:
- ref: egp-470
  id: 470
  guideword: 'FORM: ''BE'' EXPRESSIONS + INFINITIVE'
  can_do: Can use the full range of expressions with 'be' + infinitive ('be likely to', 'be due to', 'be
    meant to', 'be bound to', 'be sure to', 'be certain to', 'be obliged to') with present and past forms
    of 'be' and with modal 'will' .
  detectability: form
- ref: egp-471
  id: 471
  guideword: 'FORM: ''BE'' + ADJECTIVE + ''THAT'''
  can_do: Can use 'be' + 'obvious/sure/likely/certain' followed by a 'that'-clause.
  detectability: form
- ref: egp-472
  id: 472
  guideword: 'FORM/USE: ''BE MORE/LESS LIKELY'', COMPARISON'
  can_do: Can use '(much) more/less' to modify 'likely' in a comparison.
  detectability: form
- ref: egp-479
  id: 479
  guideword: 'FORM/USE: IMPERATIVE'
  can_do: Can use the imperative form 'be sure to', to express obligation.
  detectability: form
