note: External EGP references only — not stored in application DB
links:
- ref: egp-953
  id: 953
  guideword: 'FORM/USE: ''THESE ONES'', ''THOSE ONES'' SUBSTITUTION'
  can_do: Can use 'these ones', 'those ones' as a substitute for plural countable nouns that have previously
    been mentioned.
  detectability: form
- ref: egp-954
  id: 954
  guideword: 'FORM/USE: ''THOSE'', SUBSTITUTION'
  can_do: Can use 'those' as a substitute, followed by a relative clause or '-ed' or '-ing'.
  detectability: form
- ref: egp-962
  id: 962
  guideword: 'FORM: SUBJECT AND OBJECT PRONOUNS, ''EACH'', ''SEVERAL'', ''NEITHER'', ''ENOUGH'''
  can_do: Can use pronouns 'each', 'either', 'enough', 'neither', 'several' as subject and object pronouns.
  detectability: form
- ref: egp-963
  id: 963
  guideword: 'FORM: WITH ''OF'' + OBJECT PRONOUN'
  can_do: Can use a wide range of pronouns ('neither', 'either', 'none') with 'of' followed by an object
    pronoun.
  detectability: form
- ref: egp-979
  id: 979
  guideword: 'FORM: ''THESE ONES'', ''THOSE ONES'''
  can_do: Can use 'these ones', 'those ones' as a substitute for plural countable nouns which have already
    been mentioned or are obvious from the context.
  detectability: form
- ref: egp-1005
  id: 1005
  guideword: 'FORM/USE: ''ONE ANOTHER'', FORMAL'
  can_do: Can use 'one another' as the object of a verb or complement of a preposition to talk about the
    mutual behaviour of two or more people, often in formal contexts.
  detectability: form
