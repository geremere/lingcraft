  guideword: 'FORM/USE: ''THE MORE … THE MORE …'''
  can_do: Can use the in comparative phrases 'more', 'less', 'worse', 'better … the more', 'less', 'worse
    …' to talk about one thing that is affected by another. ► comparative clauses
  detectability: form
- ref: egp-348
