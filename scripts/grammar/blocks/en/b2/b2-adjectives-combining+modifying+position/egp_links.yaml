  id: 8
  guideword: 'FORM: COMPOUND ADJECTIVES'
  can_do: Can use an increasing range of compound adjectives ('up-to-date', 'state-of-the-art')
  detectability: form
- ref: egp-9
  id: 9
  guideword: 'FORM: PHRASES MODIFYING NOUNS'
  can_do: Can use adjective phrases to modify nouns.
  detectability: form
- ref: egp-40
  id: 40
  guideword: 'FORM: WITH ''ENOUGH'' + ''TO''-INFINITIVE'
  can_do: Can use 'enough' after adjectives followed by 'to'-infinitive
  detectability: form
- ref: egp-41
  id: 41
  guideword: 'FORM: WITH ''RATHER A'''
  can_do: Can form adjective phrases with 'rather a' + adjective, often in formal contexts.
  detectability: form
- ref: egp-53
  id: 53
  guideword: 'FORM/USE: DEGREE ADJECTIVES BEFORE NOUNS'
  can_do: Can use a limited range of degree adjectives ('real', 'absolute', 'complete') before a noun
    to express intensity.
  detectability: form
- ref: egp-54
  id: 54
  guideword: 'FORM: ATTRIBUTIVE ONLY, TIME ADJECTIVES'
  can_do: Can use the adjectives 'present', 'future', 'former' before a noun.
  detectability: form
