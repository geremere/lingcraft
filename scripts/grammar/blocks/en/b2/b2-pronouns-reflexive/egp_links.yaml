- ref: egp-913
  id: 913
  guideword: 'FORM/USE: ''BY'' + PLURAL'
  can_do: Can use plural reflexive pronouns with 'by' to mean alone, without any help.
  detectability: form
- ref: egp-914
  id: 914
  guideword: 'FORM: ''BY ITSELF'''
  can_do: Can use the reflexive pronoun 'itself' with 'by' to mean alone or without any help.
  detectability: form
- ref: egp-915
  id: 915
  guideword: 'FORM: PLURAL, AFTER PREPOSITIONS'
  can_do: Can use plural reflexive pronouns after prepositions where the object of the preposition is
    the same as the subject of the verb.
  detectability: form
- ref: egp-916
  id: 916
  guideword: 'FORM: SAME SUBJECT AND OBJECT, PLURAL'
  can_do: Can use plural reflexive pronouns to refer to actions where the subject and object of the verb
    are the same.
  detectability: form
- ref: egp-917
  id: 917
  guideword: 'USE: ''IN ITSELF'', INTENSIFYING'
  can_do: Can use the fixed expression 'in itself' as an intensifier .
  detectability: use
- ref: egp-918
  id: 918
  guideword: 'USE: ''ITSELF'', FOR EMPHASIS'
  can_do: Can use the singular pronoun 'itself' for emphasis.
  detectability: use
- ref: egp-919
  id: 919
  guideword: 'USE: PLURAL, FOR EMPHASIS'
  can_do: Can use plural reflexive pronouns for emphasis.
  detectability: use
- ref: egp-920
