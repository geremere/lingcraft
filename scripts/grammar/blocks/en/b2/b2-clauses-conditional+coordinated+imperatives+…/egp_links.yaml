note: External EGP references only — not stored in application DB
links:
- ref: egp-175
  id: 175
  guideword: 'FORM/USE: ''NEITHER … NOR'', EMPHASIS'
  can_do: Can combine two main clauses of the same type using 'neither' in front or mid position, followed
    by 'nor' to introduce the second clause, for emphasis.
  detectability: form
- ref: egp-176
  id: 176
  guideword: 'FORM/USE: ''NOT ONLY … BUT (ALSO)'', FOCUS'
  can_do: Can combine clauses using 'not only' in mid position of the first clause followed by … 'but
    (also)' to introduce the second clause, to give focus.
  detectability: form
- ref: egp-195
  id: 195
  guideword: 'FORM/USE: ''LET''S NOT'', SUGGESTION'
  can_do: Can use 'let's not' + base form of a main verb to make a suggestion.
  detectability: form
- ref: egp-196
  id: 196
  guideword: 'FORM/USE: ''DO NOT'', EMPHASIS'
  can_do: Can use 'do not' for emphasis or in formal contexts.
  detectability: form
- ref: egp-213
  id: 213
  guideword: 'FORM: NEGATIVE INTERROGATIVE + ADVERB'
  can_do: Can form negative interrogative clauses with an adverb in mid position, between the subject
    and the main verb.
  detectability: form
- ref: egp-218
  id: 218
  guideword: 'FORM/USE: NEGATIVE INTERROGATIVE'
  can_do: Can use the negative interrogative form of an auxiliary verb to express surprise or enthusiasm.
  detectability: form
- ref: egp-1119
  id: 1119
  guideword: 'FORM/USE: SUBORDINATING CONJUNCTIONS, CONDITIONS'
  can_do: Can use conditional subordinate clauses with a range of conjunctions ('as long as', 'provided')
    + present simple or present continuous, with future reference.
  detectability: form
