- ref: egp-932
  id: 932
  guideword: 'FORM: (OBJECT) USING ''IT'' TO INTRODUCE'
  can_do: Can use 'it' as an object with 'make' to introduce something the speaker or writer is going
    to refer to.
  detectability: form
- ref: egp-933
  id: 933
  guideword: 'FORM: (SUBJECT) ELLIPSIS'
  can_do: Can leave out the subject pronoun with a limited range of verbs, in informal contexts. ► ellipsis
  detectability: form
- ref: egp-934
  id: 934
  guideword: 'FORM: (SUBJECT) EMPTY ''IT'''
  can_do: Can use dummy 'it' with 'appears', 'feels', 'looks' and 'seems'.
  detectability: form
- ref: egp-935
  id: 935
  guideword: 'FORM: (SUBJECT) ''ONE'''
  can_do: Can use 'one' as a generic personal pronoun in the subject position to mean people in general.
    ► generic pronouns
  detectability: form
