- ref: egp-685
  id: 685
  guideword: 'FORM: PLURAL ''-ES'''
  can_do: Can form plurals by adding '-es' to countable nouns ending in '-o', '-ch', '-s', '-sh', '-x'
    or '-z'.
  detectability: form
- ref: egp-686
  id: 686
  guideword: 'FORM: PLURAL ''-IES'''
  can_do: Can form plurals of countable nouns ending in a consonant plus '-y', by changing the 'y' to
    'I' and adding '-es'.
  detectability: form
- ref: egp-687
  id: 687
  guideword: 'FORM: IRREGULAR PLURAL NOUNS'
  can_do: Can form some irregular plural nouns.
  detectability: form
- ref: egp-688
  id: 688
  guideword: 'FORM: NOUNS ONLY USED IN THE PLURAL'
  can_do: Can use nouns that only have a plural form, with plural agreement.
  detectability: form
