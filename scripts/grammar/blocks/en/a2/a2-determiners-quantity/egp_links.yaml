links:
- ref: egp-333
  id: 333
  guideword: 'FORM: WITH PLURAL NOUNS'
  can_do: Can use an increasing range of quantifying determiners with plural nouns ('all', 'both', 'a
    few').
  detectability: form
- ref: egp-334
  id: 334
  guideword: 'FORM: WITH PLURAL AND UNCOUNTABLE NOUNS'
  can_do: Can use a range of quantifying determiners ('some', 'any', 'no', 'more', 'a lot of') with both
    plural nouns and uncountable nouns.
  detectability: form
- ref: egp-335
  id: 335
  guideword: 'FORM: WITH SINGULAR NOUNS'
  can_do: Can use an increasing range of quantifying determiners with singular nouns ('each', 'an', 'one'
    and numbers).
  detectability: form
- ref: egp-336
  id: 336
  guideword: 'FORM: ''MUCH'' WITH UNCOUNTABLE NOUNS, NEGATIVE'
  can_do: Can use 'much' with uncountable nouns in negative contexts.
  detectability: form
- ref: egp-337
  id: 337
  guideword: 'FORM: ''MANY'' WITH PLURAL NOUNS, NEGATIVE'
  can_do: Can use 'many' with plural nouns in negative contexts.
  detectability: form
- ref: egp-338
  id: 338
  guideword: 'FORM: ''SO MANY'' WITH PLURAL NOUNS'
  can_do: Can use 'so many' and 'too many' with plural nouns.
  detectability: form
- ref: egp-339
  id: 339
  guideword: 'FORM: DETERMINER + ''OF'' + DETERMINER'
  can_do: 'Can use a range of quantifying determiners + ''of'' + determiner (''all of'', ''some of'',
    ''both of'', ''many of'', ''any of'', number + ''of'', ''each of''). ► pronouns: quantity'
  detectability: form
