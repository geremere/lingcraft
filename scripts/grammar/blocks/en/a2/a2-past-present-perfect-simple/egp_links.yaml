links:
- ref: egp-816
  id: 816
  guideword: 'FORM/USE: TIME WITH ''FOR'''
  can_do: Can use the negative form with 'for' to talk about a past event or action which hasn't occurred
    again in the period of time up to now.
  detectability: form
- ref: egp-817
  id: 817
  guideword: 'FORM/USE: WITH ''YET'''
  can_do: Can use the negative form with 'yet' to talk about events which are expected to be completed
    at some point in the future.
  detectability: form
- ref: egp-818
  id: 818
  guideword: 'FORM: AFFIRMATIVE'
  can_do: Can use the affirmative form 'have' + '-ed' with pronouns 'I' and 'we', and with a limited range
    of verbs.
  detectability: form
- ref: egp-819
  id: 819
  guideword: 'FORM: NEGATIVE'
  can_do: Can use the negative form 'haven't' + '-ed' with 'I' with a limited range of verbs.
  detectability: form
- ref: egp-820
  id: 820
  guideword: 'FORM: QUESTIONS'
  can_do: Can use the question form 'have you' + '-ed' with with a limited range of verbs.
  detectability: form
- ref: egp-821
  id: 821
  guideword: 'FORM: WITH ADVERBS'
  can_do: Can use the present perfect simple with a limited range of adverbs in the normal mid position.
  detectability: form
- ref: egp-822
  id: 822
  guideword: 'USE: EXPERIENCES'
  can_do: Can use the present perfect simple to talk about experiences up to now.
  detectability: use
