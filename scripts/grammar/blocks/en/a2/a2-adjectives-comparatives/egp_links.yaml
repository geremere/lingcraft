- ref: egp-13
  id: 13
  guideword: 'FORM: + -ER'
  can_do: Can form comparative adjectives from adjectives of one syllable by adding '-er'.
  detectability: form
- ref: egp-14
  id: 14
  guideword: 'FORM: + -IER'
  can_do: Can form comparative adjectives with adjectives of two syllables ending in '-y' by changing
    the 'y' to an 'I' and adding '-er'.
  detectability: form
- ref: egp-15
  id: 15
  guideword: 'FORM: BEFORE NOUNS'
  can_do: Can use comparative adjectives attributively, before nouns.
  detectability: form
- ref: egp-16
  id: 16
  guideword: 'FORM: COMPLEMENT OF ''BE'''
  can_do: Can use comparative adjectives as a complement of 'be'.
  detectability: form
- ref: egp-17
  id: 17
  guideword: 'FORM: DOUBLE CONSONANT + ''-ER'''
  can_do: Can form comparative adjectives with adjectives of one syllable with a short vowel, by doubling
    the final consonant and adding '-er'
  detectability: form
- ref: egp-18
  id: 18
  guideword: 'FORM: ENDING IN ''-E'' + ''-R'''
  can_do: Can form comparative adjectives with adjectives of one syllable ending in 'e', by adding '-r'.
  detectability: form
- ref: egp-19
  id: 19
  guideword: 'FORM: IRREGULAR'
  can_do: Can form irregular comparative adjectives.
  detectability: form
