links:
- ref: egp-908
  id: 908
  guideword: 'FORM: SAME SUBJECT AND OBJECT.'
  can_do: Can use a limited range of singular reflexive pronouns ('myself', 'yourself') with a limited
    range of verbs ('enjoy', 'buy') to refer to actions where the subject and object of the verb are the
    same.
  detectability: form
- ref: egp-929
  id: 929
  guideword: 'FORM: (SUBJECT) ELLIPSIS AFTER ''HOPE'''
  can_do: Can leave out the subject pronoun with 'hope'. ► ellipsis
  detectability: form
- ref: egp-930
  id: 930
  guideword: 'FORM: (SUBJECT) EMPTY ''IT'''
  can_do: Can use 'it' as an empty subject when there is nothing else to put in subject position, particularly
    with weather or time.
  detectability: form
- ref: egp-999
  id: 999
  guideword: 'USE: ''YOU'', GENERAL'
  can_do: Can use 'you' to refer to people in general.
  detectability: use
