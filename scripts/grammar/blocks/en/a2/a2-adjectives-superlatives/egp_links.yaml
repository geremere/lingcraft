note: External EGP references only — not stored in application DB
links:
- ref: egp-58
  id: 58
  guideword: 'FORM/USE: COMPLEX NOUN PHRASES'
  can_do: 'Can form a limited range of complex noun phrases with a superlative adjective  + prepositional
    phrase, to talk about something unique.► noun phrases ►  clauses: comparison'
  detectability: form
- ref: egp-59
  id: 59
  guideword: 'FORM/USE: WITH ''IN'' + NOUN'
  can_do: Can use prepositional phrases with 'in' + singular name of a place after a superlative adjective.
  detectability: form
- ref: egp-60
  id: 60
  guideword: 'FORM/USE: WITH ''OF'' + NOUN'
  can_do: Can use a limited range of prepositional phrases with 'of' after a superlative adjective, to
    refer to one thing within a set or part of a set.
  detectability: form
- ref: egp-61
  id: 61
  guideword: 'FORM: ELLIPSIS, WITH ''THE'''
  can_do: Can use 'the' with a limited range of superlative adjectives without a following noun, when
    the noun is understood.
  detectability: form
- ref: egp-62
  id: 62
  guideword: 'FORM: WITH ''-EST'''
  can_do: Can form superlative adjectives with adjectives of one syllable with a short vowel, by doubling
    the final consonant and adding '–est'.
  detectability: form
- ref: egp-63
  id: 63
  guideword: 'FORM: WITH ''-EST'''
  can_do: Can form superlative adjectives by adding the suffix '-est', to adjectives of one syllable.
  detectability: form
- ref: egp-64
  id: 64
  guideword: 'FORM: WITH ''-EST'''
  can_do: Can form superlative adjectives using the '-est' suffix, with adjectives of one syllable, and
    with two-syllable adjectives ending in -y.
  detectability: form
- ref: egp-65
  id: 65
  guideword: 'FORM: WITH ''MY'' OR ''YOUR'''
  can_do: Can form a noun phrase with 'my' or 'your' + superlative adjective + noun, with a limited range
    of nouns and contexts. ► noun phrases
  detectability: form
- ref: egp-66
  id: 66
  guideword: 'FORM: WITH ''-ST'''
  can_do: Can form superlative adjectives using the suffix '-st' to adjectives ending in '–e'.
  detectability: form
- ref: egp-67
  id: 67
  guideword: 'FORM: WITH ''THE'''
  can_do: Can form a noun phrase with 'the' + superlative adjective + noun. ► noun phrases
  detectability: form
- ref: egp-68
  id: 68
  guideword: 'FORM: WITH ''THE MOST'''
  can_do: Can form superlative adjective phrases using 'the most', with longer adjectives of two or more
    syllables.
  detectability: form
