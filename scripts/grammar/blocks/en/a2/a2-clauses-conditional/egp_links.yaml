  id: 1105
  guideword: 'FORM: ''IF'' + PRESENT SIMPLE'
  can_do: Can form conditional subordinate clause with 'if' + present simple.
  detectability: form
- ref: egp-1106
  id: 1106
  guideword: 'FORM: PRESENT SIMPLE ''IF'' CLAUSE + IMPERATIVE'
  can_do: Can use 'if' + present simple, with an imperative in the main clause.
  detectability: form
- ref: egp-1107
  id: 1107
  guideword: 'FORM/USE: PRESENT SIMPLE ''IF'' CLAUSE, REAL CONDITIONS'
  can_do: Can use 'if' + present simple with present simple, 'can' or imperative in the main clause to
    refer to things that are true now or very likely to happen.
  detectability: form
- ref: egp-1108
  id: 1108
  guideword: 'USE: ''IF'' CLAUSE + IMPERATIVE, HEDGING'
  can_do: Can use an 'if-' clause ('if you want', 'like', 'prefer') to soften the directness of imperatives,
    offers or suggestions.
  detectability: use
